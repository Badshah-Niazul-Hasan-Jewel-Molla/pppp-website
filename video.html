<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PPPP Video Center</title>

<link rel="icon" href="favicon.ico">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:linear-gradient(-45deg,#ff6b6b,#4ecdc4,#45b7d1,#96c93d);
background-size:400% 400%;
animation:bg 15s ease infinite;
padding:20px;
min-height:100vh;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
max-width:1500px;
margin:auto;
}

.header{
text-align:center;
color:white;
margin-bottom:25px;
}

.header h1{
font-size:35px;
margin-bottom:10px;
text-shadow:0 2px 10px rgba(0,0,0,.35);
}

.header p{
font-size:18px;
opacity:.95;
}

.topbar{
display:flex;
flex-wrap:wrap;
gap:15px;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.search{
flex:1;
min-width:260px;
padding:15px;
font-size:17px;
border:none;
outline:none;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.25);
}

.counter{
background:white;
padding:15px 20px;
border-radius:15px;
font-weight:bold;
box-shadow:0 5px 15px rgba(0,0,0,.25);
}

.player{
background:white;
border-radius:20px;
padding:20px;
margin-bottom:20px;
box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.player h2{
margin-bottom:15px;
}

.nowPlaying{
font-size:16px;
font-weight:bold;
margin-bottom:12px;
word-break:break-word;
color:#333;
}

#videoPlayer{
width:100%;
max-height:550px;
background:#000;
border-radius:15px;
margin-bottom:15px;
}

.controls{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.controls button{
padding:12px 18px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:15px;
font-weight:bold;
color:white;
transition:.25s;
}

.controls button:hover{
transform:scale(1.05);
}

.play{background:#16a085;}
.pause{background:#f39c12;}
.stop{background:#e74c3c;}
.prev{background:#6c5ce7;}
.next{background:#0984e3;}
.shuffle{background:#8e44ad;}
.repeat{background:#2d3436;}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
gap:18px;
}

.card{
border-radius:18px;
padding:18px;
box-shadow:0 8px 18px rgba(0,0,0,.25);
transition:.25s;
color:#fff;
}

.card:hover{
transform:translateY(-5px);
}

.filename{
font-weight:bold;
font-size:15px;
margin-bottom:15px;
word-break:break-word;
line-height:1.5;
}

.cardButtons{
display:flex;
flex-wrap:wrap;
gap:8px;
}

.cardButtons button{
flex:1;
text-align:center;
border:none;
padding:10px;
border-radius:10px;
font-size:14px;
cursor:pointer;
color:white;
transition:.25s;
}

.playBtn{background:#00b894;}
.downloadBtn{background:#0984e3;}
.copyBtn{background:#6c5ce7;}
.shareBtn{background:#e84393;}
.favoriteBtn{background:#d63031;}

.cardButtons button:hover{
transform:scale(1.05);
}

footer{
margin-top:40px;
text-align:center;
color:white;
font-weight:bold;
font-size:15px;
padding:20px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>🎬 PPPP Video Center</h1>

<p>People's Power & Peace Party (PPPP)</p>

<p>Power to the People • Peace for the People</p>

</div>

<div class="topbar">

<input
type="text"
id="search"
class="search"
placeholder="🔍 Search Video...">

<div class="counter" id="counter">

Loading...

</div>

</div>

<div class="player">

<h2>🎬 Now Playing</h2>

<div class="nowPlaying" id="nowPlaying">

No video selected.

</div>

<video id="videoPlayer" controls></video>

<div class="controls">

<button class="prev" id="prevBtn">⏮ Previous</button>

<button class="play" id="playBtn">▶ Play</button>

<button class="pause" id="pauseBtn">⏸ Pause</button>

<button class="stop" id="stopBtn">⏹ Stop</button>

<button class="next" id="nextBtn">⏭ Next</button>

<button class="shuffle" id="shuffleBtn">🔀 Shuffle</button>

<button class="repeat" id="repeatBtn">🔁 Repeat Off</button>

</div>

</div>

<div class="grid" id="grid"></div>
