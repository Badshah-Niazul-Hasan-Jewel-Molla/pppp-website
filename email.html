<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PPPP Email Directory</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#45c5dc,#63d2c6,#45c5dc);color:#fff;min-height:100vh}
.header{text-align:center;padding:35px 15px}.toolbar{display:flex;justify-content:center}.toolbar input{width:100%;max-width:420px;padding:14px;border:none;border-radius:10px}
#totalEmails{text-align:center;font-weight:bold;margin:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;padding:20px}
.card{padding:15px;border-radius:16px;background:#1e88e5;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.email{font-weight:bold}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;padding:10px 15px;border-radius:8px;display:none}
footer{text-align:center;padding:60px 20px 40px}#topBtn{display:none;position:fixed;right:25px;bottom:25px;width:65px;height:65px;border:none;border-radius:50%;background:#1e88e5;color:#fff;font-size:30px}
</style></head><body>
<header style="text-align:center;padding:35px 15px;color:#fff;overflow-x:auto;-webkit-overflow-scrolling:touch;"><h1 style="margin:0;font-size:clamp(32px,7vw,58px);white-space:nowrap;text-shadow:0 4px 10px rgba(0,0,0,.25);">📧 PPPP Emails</h1>
<h2 style="margin:15px 0 10px;font-size:clamp(18px,4vw,32px);white-space:nowrap;">People's Power & Peace Party (PPPP)</h2>
<p style="margin:0;font-size:clamp(15px,3vw,22px);">Power to the People • Peace for the People</p></header>
<div class="toolbar"><input id="search" placeholder="🔍 Search PPPP Emails..."></div>
<div id="totalEmails">Total Emails : 0</div>
<div id="grid" class="grid"></div><div id="toast" class="toast">Copied!</div>
<script>
const emails=[["pppp.bangladesh@gmail.com","প্রধান / অফিসিয়াল ইমেইল"]];
const grid=document.getElementById("grid"),toast=document.getElementById("toast");
function render(list){grid.innerHTML="";list.forEach(e=>{let d=document.createElement("div");d.className="card";d.innerHTML='<div class="email">'+e[0]+'</div><div>'+e[1]+'</div>';d.onclick=()=>{navigator.clipboard.writeText(e[0]);toast.style.display='block';setTimeout(()=>toast.style.display='none',1200)};grid.appendChild(d)});totalEmails.innerHTML="Total Emails : <b>"+list.length+"</b>";}
render(emails);
search.oninput=()=>{let q=search.value.toLowerCase();render(emails.filter(x=>(x[0]+" "+x[1]).toLowerCase().includes(q)));};
window.onscroll=()=>topBtn.style.display=(document.documentElement.scrollTop>300)?"block":"none";
function topFunction(){window.scrollTo({top:0,behavior:"smooth"});}
</script>
<footer style="text-align:center;color:#fff;padding:60px 20px 40px;overflow-x:auto;-webkit-overflow-scrolling:touch;"><hr style="border:none;height:2px;background:rgba(255,255,255,.35);margin-bottom:35px;"><h2 style="margin:0 0 15px;font-size:clamp(18px,4vw,32px);white-space:nowrap;">People's Power & Peace Party (PPPP)</h2><p style="margin:0 0 20px;font-size:clamp(15px,3vw,22px);white-space:nowrap;">Power to the People • Peace for the People</p><h3 style="margin:0 0 20px;font-size:clamp(18px,4vw,30px);white-space:nowrap;">📧 Official Email Directory</h3><p style="margin:0;">© 2014-Present PPPP. All Rights Reserved.</p></footer>
<button id="topBtn" onclick="topFunction()">↑</button>
</body></html>
