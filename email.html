<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPPP Email Directory</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ff6b6b,#4ecdc4,#45b7d1,#96c93d);background-size:400% 400%;animation:bg 15s infinite;padding:20px}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
h1{text-align:center;color:#fff}
input{width:100%;padding:14px;border-radius:12px;border:none;margin:15px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{padding:15px;border-radius:16px;color:white;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.email{font-weight:bold}
.toast{position:fixed;bottom:20px;right:20px;background:#111;color:#fff;padding:10px 15px;border-radius:8px;display:none}
</style>
</head>
<body>
<h1>PPPP Official Email Directory</h1>
<input id="search" placeholder="সার্চ করুন...">
<div class="grid" id="grid"></div>
<div id="toast" class="toast">Copied!</div>

const colors=["#ff6b6b","#6c5ce7","#00b894","#fdcb6e","#e17055","#0984e3","#e84393","#2d3436"];
const grid=document.getElementById("grid");
function render(list){
grid.innerHTML="";
list.forEach((e,i)=>{
let d=document.createElement("div");
d.className="card";
d.style.background=colors[i%colors.length];
d.innerHTML=`<div class=email>${e[0]}</div><div>${e[1]}</div>`;
d.onclick=()=>{navigator.clipboard.writeText(e[0]);toast.style.display='block';setTimeout(()=>toast.style.display='none',1500)};
grid.appendChild(d);
});
}
render(emails);
search.oninput=()=>{
const q=search.value.toLowerCase();
render(emails.filter(x=>(x[0]+" "+x[1]).toLowerCase().includes(q)));
};
</script>
</body>
</html>
