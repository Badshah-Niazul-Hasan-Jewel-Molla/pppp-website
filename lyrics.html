
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PPPP Lyrics</title>
<style>
body{font-family:Arial,sans-serif;max-width:1000px;margin:auto;padding:20px;background:#f4f4f4}
header{background:#0b6b3a;color:#fff;padding:16px;border-radius:8px}
.song{background:#fff;padding:16px;margin:16px 0;border-radius:8px}
pre{white-space:pre-wrap}
input{width:100%;padding:10px}
</style>
<script>
function filterSongs(){
 let q=document.getElementById('q').value.toLowerCase();
 document.querySelectorAll('.song').forEach(s=>{
   s.style.display=s.innerText.toLowerCase().includes(q)?'block':'none';
 });
}
</script>
</head>
<body>
<header>
<h1>🌀 PPPP Music Lyrics 🌀</h1>
<p>People's Power and Peace Party (PPPP)</p>
</header>

<input id="q" onkeyup="filterSongs()" placeholder="গানের নাম খুঁজুন...">

<div class="song">
<h2>Template</h2>
<h3>Song Title</h3>
<pre>PPPP</pre>
<h3>Lyrics</h3>
<pre>এখানে সম্পূর্ণ লিরিক্স বসান...</pre>
<h3>Style</h3>
<pre>এখানে Suno style prompt বসান...</pre>
</div>

<footer><hr><p>PPPP Lyrics Library</p></footer>
</body>
</html>
