<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPPP Letter Icons Download</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#197619;
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
}

h1{
    text-align:center;
    color:#199595;
    font-size:3rem;
    margin-bottom:10px;
}

p{
    text-align:center;
    color:#199595;
    font-size:1.3rem;
    margin-bottom:35px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    border-radius:18px;
    padding:20px;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
    transition:.3s;
}

.card:hover{
    transform:translateY(-6px) scale(1.02);
}

.image-container{
    position:relative;
    width:180px;
    height:180px;
    margin:0 auto 15px;
}

.image-container img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.letter-placeholder{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:90px;
    font-weight:bold;
    color:#ffffff;
    background:rgba(0,0,0,.15);
    border-radius:12px;
}

.card h3{
    color:#ffffff;
    font-size:2rem;
    margin-bottom:15px;
}

.download-btn{
    display:inline-block;
    background:#195795;
    color:#ffffff;
    text-decoration:none;
    padding:12px 24px;
    border-radius:10px;
    font-size:1.1rem;
    font-weight:bold;
    transition:.3s;
}

.download-btn:hover{
    transform:scale(1.05);
}

@media(max-width:768px){

    h1{
        font-size:2.2rem;
    }

    p{
        font-size:1.1rem;
    }

    .image-container{
        width:150px;
        height:150px;
    }

    .letter-placeholder{
        font-size:75px;
    }
}
</style>
</head>
<body>

<div class="container">

    <h1>PPPP Letter Icons</h1>
    <p>Download A–Z Letter Icons</p>

    <div class="grid" id="lettersGrid"></div>

</div>

<script>

const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

const colors = [
"#FF0000",
"#FF4500",
"#FF8C00",
"#FFD700",
"#FFFF00",
"#ADFF2F",
"#32CD32",
"#00FF00",
"#00FA9A",
"#00FFFF",
"#1E90FF",
"#0000FF",
"#4169E1",
"#6A5ACD",
"#8A2BE2",
"#9400D3",
"#FF00FF",
"#FF1493",
"#DC143C",
"#A52A2A",
"#8B4513",
"#708090",
"#2F4F4F",
"#008080",
"#20B2AA",
"#4682B4"
];

const grid = document.getElementById("lettersGrid");

letters.forEach((letter,index)=>{

    const fileName = `${letter}_Letter_Icon.png`;

    const card = document.createElement("div");
    card.className = "card";

    card.style.background = colors[index];

    card.innerHTML = `
        <div class="image-container">

            <div class="letter-placeholder">
                ${letter}
            </div>

            <img
                src="${fileName}"
                alt="${letter}"
                loading="lazy"
                onload="this.previousElementSibling.style.display='none';"
            >

        </div>

        <h3>${letter}</h3>

        <a href="${fileName}" download class="download-btn">
            Download
        </a>
    `;

    grid.appendChild(card);

});

</script>

</body>
</html>
