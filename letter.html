<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPPP Letter Icons Download</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(180deg,#67d9d9,#4fc3c3);
    padding:20px;
    min-height:100vh;
}

.container{
    max-width:1400px;
    margin:auto;
}

h1{
    text-align:center;
    color:#fff;
    font-size:3rem;
    margin-bottom:10px;
}

p{
    text-align:center;
    color:#fff;
    font-size:1.3rem;
    margin-bottom:35px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    border-radius:25px;
    padding:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
    transition:.3s;
}

.card:hover{
    transform:translateY(-6px) scale(1.02);
}

.image-container{
    position:relative;
    width:180px;
    height:180px;
    margin:0 auto 15px;
}

.image-container img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.letter-placeholder{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:90px;
    font-weight:bold;
    color:#fff;
    background:rgba(255,255,255,.15);
    border-radius:12px;
}

.card h3{
    color:#fff;
    font-size:2rem;
    margin-bottom:15px;
}

.download-btn{
    display:inline-block;
    background:#ffffff;
    color:#333;
    text-decoration:none;
    padding:12px 24px;
    border-radius:10px;
    font-size:1.1rem;
    font-weight:bold;
    transition:.3s;
}

.download-btn:hover{
    transform:scale(1.05);
}

@media(max-width:768px){

    h1{
        font-size:2.2rem;
    }

    p{
        font-size:1.1rem;
    }

    .image-container{
        width:150px;
        height:150px;
    }

    .letter-placeholder{
        font-size:75px;
    }
}
</style>
</head>
<body>

<div class="container">

    <h1>PPPP Letter Icons</h1>
    <p>Download PPPP Letters</p>

    <div class="grid" id="lettersGrid"></div>

</div>

<script>

const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

const colors = [
"#ff6b6b",
"#6c5ce7",
"#00b894",
"#fdcb6e",
"#e17055",
"#0984e3",
"#e84393",
"#00cec9",
"#a29bfe",
"#55efc4",
"#fab1a0",
"#74b9ff",
"#fd79a8",
"#81ecec",
"#ffeaa7",
"#00b894",
"#6c5ce7",
"#ff7675",
"#00cec9",
"#fdcb6e",
"#0984e3",
"#e84393",
"#55efc4",
"#a29bfe",
"#26de81",
"#ff9f43"
];

const grid = document.getElementById("lettersGrid");

letters.forEach((letter,index)=>{

    const fileName = `${letter}_Letter_Icon.jpg`;

    const card = document.createElement("div");
    card.className = "card";
    card.style.background = colors[index];

    card.innerHTML = `
        <div class="image-container">

            <div class="letter-placeholder">
                ${letter}
            </div>

            <img
                src="${fileName}"
                alt="${letter}"
                loading="lazy"
                onload="this.previousElementSibling.style.display='none';"
            >

        </div>

        <h3>${letter}</h3>

        <a href="${fileName}"
           download="${letter}_Letter_Icon.jpg"
           class="download-btn">
           📥 Download
        </a>
    `;

    grid.appendChild(card);

});

</script>

</body>
</html>
