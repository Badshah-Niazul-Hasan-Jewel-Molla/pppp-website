<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPPP Letter Icons Download</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#45c5dc,#63d2c6,#45c5dc);
    color:#fff;
    padding:20px;
    min-height:100vh;
}

.container{
    max-width:1400px;
    margin:auto;
}

h1{
    text-align:center;
    color:#fff;
    font-size:3rem;
    margin-bottom:10px;
}

p{
    text-align:center;
    color:#fff;
    font-size:1.3rem;
    margin-bottom:35px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    border-radius:25px;
    padding:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
    transition:.3s;
}

.card:hover{
    transform:translateY(-6px) scale(1.02);
}

.image-container{
    position:relative;
    width:180px;
    height:180px;
    margin:0 auto 15px;
}

.image-container img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.letter-placeholder{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:90px;
    font-weight:bold;
    color:#fff;
    background:rgba(255,255,255,.15);
    border-radius:12px;
}

.card h3{
    color:#fff;
    font-size:2rem;
    margin-bottom:15px;
}

.download-btn{
    display:inline-block;
    background:#ffffff;
    color:#333;
    text-decoration:none;
    padding:12px 24px;
    border-radius:10px;
    font-size:1.1rem;
    font-weight:bold;
    transition:.3s;
}

.download-btn:hover{
    transform:scale(1.05);
}

@media(max-width:768px){

    h1{
        font-size:2.2rem;
    }

    p{
        font-size:1.1rem;
    }

    .image-container{
        width:150px;
        height:150px;
    }

    .letter-placeholder{
        font-size:75px;
    }
}
#topBtn{
display:none;
position:fixed;
right:25px;
bottom:25px;
width:65px;
height:65px;
border:none;
border-radius:50%;
background:#1e88e5;
color:#fff;
font-size:30px;
cursor:pointer;
box-shadow:0 6px 16px rgba(0,0,0,.35);
transition:.3s;
z-index:9999;
}

#topBtn:hover{
background:#1565c0;
transform:scale(1.08);
}
</style>
</head>
<body>

<header style="text-align:center;padding:35px 20px;color:#fff;">
    <h1 style="
margin:0;
font-size:clamp(38px,8vw,58px);
white-space:nowrap;
text-align:center;
text-shadow:0 4px 10px rgba(0,0,0,.25);
">
🅿️ PPPP Letters
</h1>

    <h2 style="margin:18px 0 10px;">
        People's Power & Peace Party (PPPP)
    </h2>

    <p style="margin:0;color:#fff;font-size:1.5rem;">
        Power to the People • Peace for the People
    </p>
</header>

<div class="container">

    <div class="grid" id="lettersGrid"></div>

</div>

<script>

const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

const colors = [
"#ff6b6b",
"#6c5ce7",
"#00b894",
"#fdcb6e",
"#e17055",
"#0984e3",
"#e84393",
"#00cec9",
"#a29bfe",
"#55efc4",
"#fab1a0",
"#74b9ff",
"#fd79a8",
"#81ecec",
"#ffeaa7",
"#00b894",
"#6c5ce7",
"#ff7675",
"#00cec9",
"#fdcb6e",
"#0984e3",
"#e84393",
"#55efc4",
"#a29bfe",
"#26de81",
"#ff9f43"
];

const grid = document.getElementById("lettersGrid");

letters.forEach((letter,index)=>{

    const fileName = `${letter}_Letter_Icon.jpg`;

    const card = document.createElement("div");
    card.className = "card";
    card.style.background = colors[index];

    card.innerHTML = `
        <div class="image-container">

            <div class="letter-placeholder">
                ${letter}
            </div>

            <img
                src="${fileName}"
                alt="${letter}"
                loading="lazy"
                onload="this.previousElementSibling.style.display='none';"
            >

        </div>

        <h3>${letter}</h3>

        <a href="${fileName}"
           download="${letter}_Letter_Icon.jpg"
           class="download-btn">
           📥 Download
        </a>
    `;

    grid.appendChild(card);

});

window.onscroll=function(){
const btn=document.getElementById("topBtn");

if(document.documentElement.scrollTop>300){
btn.style.display="block";
}else{
btn.style.display="none";
}
};

function topFunction(){
window.scrollTo({
top:0,
behavior:"smooth"
});
}

</script>

<footer style="text-align:center;color:#fff;padding:60px 20px 40px;">

<hr style="border:none;height:2px;background:rgba(255,255,255,.35);margin-bottom:35px;">

<h2>People's Power & Peace Party (PPPP)</h2>

<p style="color:#fff;">
Power to the People • Peace for the People
</p>

<h3>🅿️ Official Letter Library</h3>

<p>
🌐
<a href="https://naz-niaz.github.io/pppp_bangladesh/"
target="_blank"
style="color:#fff;text-decoration:underline;">
https://naz-niaz.github.io/pppp_bangladesh/
</a>
</p>

<p style="color:#fff;">
© 2014-Present PPPP. All Rights Reserved.
</p>

</footer>

<button id="topBtn" onclick="topFunction()">↑</button>

</body>
</html>
