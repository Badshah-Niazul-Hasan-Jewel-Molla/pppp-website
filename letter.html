<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPPP Letter Icons Download</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#197619;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    color:#199595;
    font-size:3rem;
    margin-bottom:10px;
}

p{
    text-align:center;
    color:#199595;
    font-size:1.3rem;
    margin-bottom:35px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    border:2px solid #199595;
    border-radius:18px;
    padding:20px;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
    transition:.3s;
}

.card:hover{
    transform:translateY(-6px) scale(1.02);
}

.card img{
    width:180px;
    height:180px;
    object-fit:contain;
    margin-bottom:15px;
}

.card h3{
    color:#ffffff;
    font-size:2rem;
    margin-bottom:15px;
}

.download-btn{
    display:inline-block;
    background:#195795;
    color:#ffffff;
    text-decoration:none;
    padding:12px 24px;
    border-radius:10px;
    font-size:1.2rem;
    font-weight:bold;
    transition:.3s;
}

.download-btn:hover{
    opacity:.9;
    transform:scale(1.05);
}

@media(max-width:768px){

    h1{
        font-size:2.2rem;
    }

    p{
        font-size:1.1rem;
    }

    .card img{
        width:150px;
        height:150px;
    }
}
</style>
</head>
<body>

<div class="container">

    <h1>PPPP Letter Icons</h1>
    <p>Download A–Z Letter Icons</p>

    <div class="grid" id="lettersGrid"></div>

</div>

<script>

const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

const colors = [
    "#195795",
    "#197619",
    "#199595",
    "#193857",
    "#195719"
];

const grid = document.getElementById("lettersGrid");

letters.forEach((letter,index)=>{

    const fileName = `${letter}_Letter_Icon.png`;

    const color1 = colors[index % colors.length];
    const color2 = colors[(index + 1) % colors.length];

    const card = document.createElement("div");
    card.className = "card";

    card.style.background =
        `linear-gradient(135deg, ${color1}, ${color2})`;

    card.innerHTML = `
        <img src="${fileName}" alt="${letter} Letter Icon">

        <h3>${letter}</h3>

        <a href="${fileName}" download class="download-btn">
            Download
        </a>
    `;

    grid.appendChild(card);

});

</script>

</body>
</html>
