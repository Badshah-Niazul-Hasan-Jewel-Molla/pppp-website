<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
⚙️ PPPP Settings | People's Power & Peace Party Bangladesh
</title>

<meta
    name="description"
    content="PPPP Settings & Control Center"
>

<link rel="icon" href="favicon.ico">


<!-- =========================================================
     SETTINGS PAGE BASIC STYLE
========================================================= -->

<style>

*,
*::before,
*::after{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    padding:0;
    min-height:100vh;
    font-family:
        Arial,
        "Noto Sans Bengali",
        sans-serif;
}


/* =========================================================
   SETTINGS PAGE CONTAINER
========================================================= */

#ppppSettingsPage{
    width:100%;
    min-height:100vh;
}


/* =========================================================
   SHARE & BACK TO TOP
========================================================= */

.pppp-page-floating-btn{

    position:fixed;

    right:20px;

    width:65px;
    height:65px;

    border:none;
    border-radius:50%;

    background:#1e88e5;

    color:#fff;

    font-size:30px;

    cursor:pointer;

    box-shadow:
        0 6px 16px rgba(0,0,0,.35);

    transition:.3s;

    z-index:999999;

    display:flex;
    align-items:center;
    justify-content:center;

}

.pppp-page-floating-btn:hover{

    background:#1565c0;

    transform:scale(1.08);

}


#ppppPageShareBtn{
    bottom:105px;
}


#ppppPageTopBtn{

    bottom:25px;

    display:none;

}


/* =========================================================
   LOADING MESSAGE
========================================================= */

#ppppSettingsLoading{

    min-height:100vh;

    display:flex;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:30px;

    font-size:18px;
    font-weight:700;

}

</style>

</head>


<body>


<!-- =========================================================
     ⚙️ PPPP SETTINGS MASTER CONTAINER
========================================================= -->

<div id="ppppSettingsPage">

    <div id="ppppSettingsLoading">

        ⚙️ PPPP Settings Loading...

    </div>

</div>



<!-- =========================================================
     🔗 SHARE BUTTON
========================================================= -->

<button
    id="ppppPageShareBtn"
    class="pppp-page-floating-btn"
    title="Share"
    aria-label="Share">

    🔗

</button>



<!-- =========================================================
     ↑ BACK TO TOP BUTTON
========================================================= -->

<button
    id="ppppPageTopBtn"
    class="pppp-page-floating-btn"
    title="Back to Top"
    aria-label="Back to Top">

    ↑

</button>



<!-- =========================================================
     ⚙️ LOAD MASTER SETTING.HTML
========================================================= -->

<script>

(async function(){

    const MASTER_SETTINGS =
        "setting.html";

    const container =
        document.getElementById(
            "ppppSettingsPage"
        );


    try{

        /*
         * -----------------------------------------------------
         * LOAD MASTER SETTING FILE
         * -----------------------------------------------------
         */

        const response =
            await fetch(
                MASTER_SETTINGS,
                {
                    cache:"no-cache"
                }
            );


        if(!response.ok){

            throw new Error(
                "setting.html could not be loaded."
            );

        }


        const source =
            await response.text();



        /*
         * -----------------------------------------------------
         * EXTRACT CSS
         * -----------------------------------------------------
         */

        const styleMatches =
            source.match(
                /<style\b[^>]*>[\s\S]*?<\/style>/gi
            ) || [];


        styleMatches.forEach(
            function(styleBlock){

                const style =
                    document.createElement(
                        "style"
                    );


                style.textContent =
                    styleBlock
                    .replace(
                        /^<style\b[^>]*>/i,
                        ""
                    )
                    .replace(
                        /<\/style>$/i,
                        ""
                    );


                style.dataset.ppppSettings =
                    "master";


                document.head.appendChild(
                    style
                );

            }
        );



        /*
         * -----------------------------------------------------
         * REMOVE CSS FROM SOURCE
         * -----------------------------------------------------
         */

        let content =
            source.replace(
                /<style\b[^>]*>[\s\S]*?<\/style>/gi,
                ""
            );



        /*
         * -----------------------------------------------------
         * EXTRACT JAVASCRIPT
         * -----------------------------------------------------
         */

        const scriptMatches =
            content.match(
                /<script\b[^>]*>[\s\S]*?<\/script>/gi
            ) || [];



        /*
         * -----------------------------------------------------
         * REMOVE JAVASCRIPT FROM HTML
         * -----------------------------------------------------
         */

        content =
            content.replace(
                /<script\b[^>]*>[\s\S]*?<\/script>/gi,
                ""
            );



        /*
         * -----------------------------------------------------
         * INSERT SETTINGS HTML
         * -----------------------------------------------------
         */

        container.innerHTML =
            content;



        /*
         * -----------------------------------------------------
         * EXECUTE MASTER SETTINGS JAVASCRIPT
         * -----------------------------------------------------
         */

        for(
            const scriptBlock
            of scriptMatches
        ){

            const temp =
                document.createElement(
                    "div"
                );


            temp.innerHTML =
                scriptBlock;


            const oldScript =
                temp.querySelector(
                    "script"
                );


            if(!oldScript)
                continue;


            const newScript =
                document.createElement(
                    "script"
                );


            /*
             * External JavaScript
             */

            if(
                oldScript.getAttribute(
                    "src"
                )
            ){

                newScript.src =
                    new URL(
                        oldScript.getAttribute(
                            "src"
                        ),
                        window.location.href
                    ).href;

            }


            /*
             * Inline JavaScript
             */

            else{

                newScript.textContent =
                    oldScript.textContent;

            }


            /*
             * Preserve script attributes
             */

            Array.from(
                oldScript.attributes
            ).forEach(
                function(attr){

                    if(
                        attr.name !== "src"
                    ){

                        newScript.setAttribute(
                            attr.name,
                            attr.value
                        );

                    }

                }
            );


            newScript.dataset.ppppSettings =
                "master";


            document.body.appendChild(
                newScript
            );

        }



        /*
         * -----------------------------------------------------
         * MASTER SETTINGS LOADED
         * -----------------------------------------------------
         */

        document.dispatchEvent(
            new CustomEvent(
                "ppppSettingsLoaded"
            )
        );


        console.log(
            "⚙️ PPPP Master Settings loaded successfully."
        );


    }

    catch(error){

        console.error(
            "⚙️ PPPP Settings Error:",
            error
        );


        container.innerHTML = `

            <div
                style="
                    padding:30px;
                    text-align:center;
                    font-weight:700;
                "
            >

                ⚠️ PPPP Settings load করা সম্ভব হয়নি।<br><br>

                Please check <b>setting.html</b>.

            </div>

        `;

    }

})();

</script>



<!-- =========================================================
     🔗 SHARE + ↑ BACK TO TOP JAVASCRIPT
========================================================= -->

<script>


/* =========================================================
   ↑ BACK TO TOP
========================================================= */

window.addEventListener(
    "scroll",
    function(){

        const topBtn =
            document.getElementById(
                "ppppPageTopBtn"
            );


        if(
            window.scrollY > 300
        ){

            topBtn.style.display =
                "flex";

        }

        else{

            topBtn.style.display =
                "none";

        }

    }
);


document.getElementById(
    "ppppPageTopBtn"
).onclick = function(){

    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

};



/* =========================================================
   🔗 SHARE
========================================================= */

document.getElementById(
    "ppppPageShareBtn"
).onclick = async function(){

    const shareData = {

        title:
            document.title,

        text:
            "People's Power & Peace Party (PPPP) Bangladesh Official Website",

        url:
            window.location.href

    };


    if(
        navigator.share
    ){

        try{

            await navigator.share(
                shareData
            );

        }

        catch(error){

            /*
             * User cancelled Share dialog.
             * No action required.
             */

        }

    }

    else{

        try{

            await navigator.clipboard.writeText(
                window.location.href
            );

            alert(
                "Website link copied successfully!"
            );

        }

        catch(error){

            alert(
                "Website link copy করা সম্ভব হয়নি।"
            );

        }

    }

};

</script>


</body>

</html>
