<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>⚙️ PPPP Settings | People's Power & Peace Party Bangladesh</title>

<link rel="icon" href="favicon.ico">

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#fff;
    overflow-x:hidden;
}

/* =========================================================
   FULL SETTINGS PAGE
========================================================= */

#ppppSettingsPageFrame{
    width:100%;
    height:100vh;
    min-height:100vh;
    border:0;
    display:block;
    background:#fff;
}

/* =========================================================
   FALLBACK
========================================================= */

#ppppSettingsFallback{
    display:none;
    padding:30px 20px;
    text-align:center;
    font-family:Arial,sans-serif;
}

#ppppSettingsFallback h2{
    color:#1976d2;
}

#ppppSettingsFallback a{
    display:inline-block;
    margin-top:15px;
    padding:12px 22px;
    border-radius:25px;
    background:#1976d2;
    color:#fff;
    text-decoration:none;
    font-weight:bold;
}

</style>

</head>

<body>

<!-- =========================================================
     ⚙️ COMPLETE PPPP SETTINGS
     বর্তমান কাজ করা setting.html সরাসরি এখানে দেখানো হবে
========================================================= -->

<iframe
    id="ppppSettingsPageFrame"
    src="setting.html"
    title="PPPP Settings">
</iframe>


<!-- =========================================================
     FALLBACK
========================================================= -->

<div id="ppppSettingsFallback">

    <h2>⚙️ PPPP Settings</h2>

    <p>
        PPPP Settings লোড করা যাচ্ছে না।
    </p>

    <a href="setting.html">
        ⚙️ Open PPPP Settings
    </a>

</div>


<script>

/* =========================================================
   SETTINGS FRAME CHECK
========================================================= */

const settingsFrame =
    document.getElementById("ppppSettingsPageFrame");

const settingsFallback =
    document.getElementById("ppppSettingsFallback");


settingsFrame.addEventListener(
    "error",
    function(){

        settingsFrame.style.display = "none";

        settingsFallback.style.display = "block";

    }
);


/* =========================================================
   FRAME HEIGHT PROTECTION
========================================================= */

function ppppResizeSettingsFrame(){

    try{

        const frameDocument =
            settingsFrame.contentDocument ||
            settingsFrame.contentWindow.document;

        if(frameDocument){

            const height =
                Math.max(
                    frameDocument.body.scrollHeight,
                    frameDocument.documentElement.scrollHeight,
                    window.innerHeight
                );

            settingsFrame.style.height =
                height + "px";

        }

    }catch(error){

        /*
          Cross-origin হলে browser নিরাপত্তার কারণে
          height read করা যাবে না।
          সেক্ষেত্রে 100vh ব্যবহার হবে।
        */

        settingsFrame.style.height =
            "100vh";

    }

}


settingsFrame.addEventListener(
    "load",
    function(){

        ppppResizeSettingsFrame();

        setTimeout(
            ppppResizeSettingsFrame,
            500
        );

        setTimeout(
            ppppResizeSettingsFrame,
            1500
        );

    }
);


window.addEventListener(
    "resize",
    ppppResizeSettingsFrame
);

</script>

</body>

</html>
