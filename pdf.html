<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PPPP PDF | People's Power & Peace Party Bangladesh</title>

<link rel="icon" href="favicon.ico">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#1d1d1d;
color:#fff;
padding:20px;
}

h1{
text-align:center;
margin-bottom:20px;
font-size:30px;
}

.search{
width:100%;
padding:15px;
font-size:18px;
border:none;
border-radius:14px;
outline:none;
background:#2b2b2b;
color:#fff;
margin-bottom:25px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
}

.card{
padding:18px;
border-radius:18px;
color:#fff;
box-shadow:0 8px 20px rgba(0,0,0,.35);
display:flex;
flex-direction:column;
gap:15px;
}

.title{
font-size:20px;
font-weight:bold;
word-break:break-word;
}

.buttons{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

button,a.btn{
text-decoration:none;
border:none;
padding:12px;
border-radius:12px;
cursor:pointer;
font-size:15px;
font-weight:bold;
text-align:center;
color:#111;
transition:.2s;
}

button:hover,
a.btn:hover{
transform:scale(1.03);
}

.view{background:#ffe66d;}
.download{background:#00cec9;}
.copy{background:#fab1a0;}
.share{background:#a29bfe;}

.footer{
margin-top:30px;
text-align:center;
color:#aaa;
}

</style>
</head>
<body>

<h1> 📕 PPPP PDF </h1>

<input
id="search"
class="search"
placeholder="🔍 Search PPPP PDF...">

<div class="grid" id="grid"></div>

<div class="footer">
Total PDF : <span id="count"></span>
</div>

<script>

const colors=[
"#ff6b6b",
"#6c5ce7",
"#00b894",
"#fdcb6e",
"#e17055",
"#0984e3",
"#e84393",
"#2d3436"
];

const files=[
"PPPP.pdf",
"PPPP_Constitution.pdf",
"PPPP_Election_Manifesto.pdf",
"PPPP_Membership_Form.pdf",
"PPPP_Politics_Zero_Cost.pdf",
"PPPP_Election_Zero_Cost.pdf",
"PPPP_MP_Candidate_Zero_Cost.pdf",
"PPPP_Volunteers_Zero_Cost.pdf"
];

const grid=document.getElementById("grid");

function draw(list){

grid.innerHTML="";

list.forEach((file,index)=>{

const color=colors[index%colors.length];

const url="pdf/"+file;

const card=document.createElement("div");
card.className="card";
card.style.background=color;

card.innerHTML=`

<div class="title">
${file.replace(".pdf","").replaceAll("_"," ")}
</div>

<div class="buttons">

<a class="btn view"
target="_blank"
href="${url}">
👀 View
</a>

<a class="btn download"
download
href="${url}">
📥 Download
</a>

<button class="copy">
🔗 Copy Link
</button>

<button class="share">
📤 Share
</button>

</div>

`;

card.querySelector(".copy").onclick=()=>{

navigator.clipboard.writeText(location.origin+location.pathname.replace("pdf.html","")+url);

alert("Link Copied");

};

card.querySelector(".share").onclick=()=>{

const link=location.origin+location.pathname.replace("pdf.html","")+url;

if(navigator.share){

navigator.share({
title:file,
text:file,
url:link
});

}else{

navigator.clipboard.writeText(link);
alert("Link Copied");

}

};

grid.appendChild(card);

});

document.getElementById("count").innerText=list.length;

}

draw(files);

document.getElementById("search").addEventListener("input",e=>{

const q=e.target.value.toLowerCase();

draw(files.filter(f=>f.toLowerCase().includes(q)));

});

</script>

<script type="module" src="chat/chat-loader.js"></script>

</body>
</html>
