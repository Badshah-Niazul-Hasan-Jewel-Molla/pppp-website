<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#0066ff">

<title>PPPP Chat | People's Power & Peace Party Bangladesh</title>

<link rel="icon" href="../favicon.ico">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="chat.css">

</head>

<body>

<!-- Floating Chat Button -->
<div
    id="pppp-chat-button"
    aria-label="Open Chat"
    title="Open Chat"
>
    💬
</div>

<!-- Chat Window -->
<div
    id="pppp-chat-widget"
    class="pppp-chat-window"
>

    <!-- Header -->
    <div class="pppp-chat-header">

        <div>

            <div class="title">
                PPPP Support
            </div>

            <div
                id="chat-status"
                class="status"
            >
                🟢 Online
            </div>

        </div>

        <button
            id="chat-close"
            aria-label="Close Chat"
            title="Close Chat"
        >
            ✕
        </button>

    </div>

    <!-- Messages -->
    <div
        id="chat-messages"
        class="pppp-chat-messages"
    ></div>

    <!-- Typing -->
    <div
        id="chat-typing"
        class="pppp-chat-typing"
    ></div>

    <!-- Footer -->
    <div class="pppp-chat-footer">

        <input

            id="chat-text"

            type="text"

            placeholder="Type your message..."

            autocomplete="off"

        >

        <button id="chat-send">

            Send

        </button>

    </div>

</div>

<script type="module" src="chat.js"></script>

<!-- Floating Share & Back To Top Buttons -->

<style>
.floating-btn{
position:fixed;
right:20px;
width:65px;
height:65px;
border:none;
border-radius:50%;
background:#1e88e5;
color:#fff;
font-size:30px;
cursor:pointer;
box-shadow:0 6px 16px rgba(0,0,0,.35);
transition:.3s;
z-index:99999;
display:flex;
align-items:center;
justify-content:center;
}

.floating-btn:hover{
background:#1565c0;
transform:scale(1.08);
}

#shareBtn{
bottom:105px;
}

#topBtn{
bottom:25px;
display:none;
}
</style>

<button id="shareBtn" class="floating-btn" title="Share">
🔗
</button>

<button id="topBtn" class="floating-btn" title="Back to Top">
↑
</button>

<script>
// Back To Top
window.addEventListener("scroll",function(){

const topBtn=document.getElementById("topBtn");

if(document.documentElement.scrollTop>300){
topBtn.style.display="flex";
}else{
topBtn.style.display="none";
}

});

document.getElementById("topBtn").onclick=function(){

window.scrollTo({
top:0,
behavior:"smooth"
});

};

// Website Share
document.getElementById("shareBtn").onclick=async function(){

const shareData={
title:document.title,
text:"People's Power & Peace Party (PPPP) Bangladesh Official Website",
url:window.location.href
};

if(navigator.share){

try{
await navigator.share(shareData);
}catch(e){}

}else{

navigator.clipboard.writeText(window.location.href);

alert("Website link copied successfully!");

}

};
</script>

</body>
</html>
