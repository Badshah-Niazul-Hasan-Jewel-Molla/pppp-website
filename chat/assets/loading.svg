<svg xmlns="http://www.w3.org/2000/svg"
     width="64"
     height="64"
     viewBox="0 0 100 100">

    <circle
        cx="50"
        cy="50"
        r="35"
        fill="none"
        stroke="#E5E7EB"
        stroke-width="8"/>

    <circle
        cx="50"
        cy="50"
        r="35"
        fill="none"
        stroke="#0D6EFD"
        stroke-width="8"
        stroke-linecap="round"
        stroke-dasharray="165"
        stroke-dashoffset="120">

        <animateTransform
            attributeName="transform"
            type="rotate"
            from="0 50 50"
            to="360 50 50"
            dur="1s"
            repeatCount="indefinite"/>

    </circle>

</svg>
