<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Offline | PPPP Bangladesh</title>

<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">

<link rel="icon"
      href="/pppp_bangladesh/web-app-manifest-192x192.png">

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-family:Arial,sans-serif;
    background:#ffffff;
    color:#222;
    padding:20px;
    box-sizing:border-box;
}

.logo{
    width:180px;
    max-width:80%;
    margin-bottom:20px;
}

h1{
    margin:10px 0;
}

p{
    max-width:500px;
    line-height:1.6;
    margin-bottom:25px;
}

.retry-btn{
    padding:12px 24px;
    border:none;
    border-radius:6px;
    background:#0066cc;
    color:#ffffff;
    font-size:16px;
    cursor:pointer;
}

.retry-btn:hover{
    opacity:0.9;
}
</style>
</head>
<body>

<img
  src="/pppp_bangladesh/offline.png"
  alt="PPPP Bangladesh Logo"
  class="logo"
  loading="eager"
  decoding="async">

<h1>You are currently offline</h1>

<p>
Please check your internet connection and try again.
The PPPP Bangladesh website will automatically become available once your connection is restored.
Thank you for your patience.
</p>

<button
  class="retry-btn"
  type="button"
  aria-label="Retry connection"
  onclick="location.reload()">
  Try Again
</button>

</body>
</html>
