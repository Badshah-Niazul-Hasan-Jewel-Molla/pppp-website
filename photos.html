<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PPPP Photos Center</title>

<link rel="icon" href="favicon.ico">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:linear-gradient(-45deg,#ff6b6b,#4ecdc4,#45b7d1,#96c93d);
background-size:400% 400%;
animation:bg 15s ease infinite;
padding:20px;
min-height:100vh;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
max-width:1500px;
margin:auto;
}

.header{
text-align:center;
color:white;
margin-bottom:25px;
}

.header h1{
font-size:35px;
margin-bottom:10px;
text-shadow:0 2px 10px rgba(0,0,0,.35);
}

.header p{
font-size:18px;
opacity:.95;
}

.topbar{
display:flex;
flex-wrap:wrap;
gap:15px;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.search{
flex:1;
min-width:260px;
padding:15px;
font-size:17px;
border:none;
outline:none;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.25);
}

.counter{
background:white;
padding:15px 20px;
border-radius:15px;
font-weight:bold;
box-shadow:0 5px 15px rgba(0,0,0,.25);
}

.viewer{
background:white;
border-radius:20px;
padding:20px;
margin-bottom:20px;
box-shadow:0 10px 25px rgba(0,0,0,.25);
text-align:center;
}

.viewer h2{
margin-bottom:15px;
}

.nowViewing{
font-size:16px;
font-weight:bold;
margin-bottom:15px;
word-break:break-word;
color:#333;
}

#photoViewer{
width:100%;
max-height:650px;
object-fit:contain;
background:#eee;
border-radius:15px;
margin-bottom:20px;
cursor:pointer;
}

.controls{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
}

.controls button{
padding:12px 18px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:15px;
font-weight:bold;
color:white;
transition:.25s;
}

.controls button:hover{
transform:scale(1.05);
}

.prev{background:#6c5ce7;}
.next{background:#0984e3;}
.shuffle{background:#8e44ad;}
.zoomIn{background:#00b894;}
.zoomOut{background:#e17055;}
.reset{background:#2d3436;}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
gap:18px;
}

.card{
background:white;
border-radius:18px;
padding:18px;
box-shadow:0 8px 18px rgba(0,0,0,.25);
transition:.25s;
}

.card:hover{
transform:translateY(-5px);
}

.thumbnail{
width:100%;
height:180px;
object-fit:cover;
border-radius:12px;
margin-bottom:12px;
cursor:pointer;
}

.filename{
font-weight:bold;
margin-bottom:15px;
word-break:break-word;
}

.cardButtons{
display:flex;
flex-wrap:wrap;
gap:8px;
}

.cardButtons button,
.cardButtons a{
flex:1;
padding:10px;
border:none;
border-radius:10px;
text-align:center;
text-decoration:none;
font-size:14px;
cursor:pointer;
color:white;
transition:.25s;
}

.cardButtons button:hover,
.cardButtons a:hover{
transform:scale(1.05);
}

.viewBtn{background:#00b894;}
.downloadBtn{background:#0984e3;}
.copyBtn{background:#6c5ce7;}
.shareBtn{background:#e84393;}
.favoriteBtn{background:#d63031;}

footer{
margin-top:40px;
text-align:center;
color:white;
font-weight:bold;
padding:20px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🖼 PPPP Photos Center</h1>
<p>People's Power & Peace Party (PPPP)</p>
<p>Power to the People • Peace for the People</p>
</div>

<div class="topbar">

<input
type="text"
id="search"
class="search"
placeholder="🔍 Search Photo...">

<div
class="counter"
id="counter">
Loading...
</div>

</div>

<div class="viewer">

<h2>🖼 Now Viewing</h2>

<div
id="nowViewing"
class="nowViewing">
No photo selected.
</div>

<img
id="photoViewer"
src=""
alt="PPPP Photo">

<div class="controls">

<button class="prev" id="prevBtn">
⏮ Previous
</button>

<button class="next" id="nextBtn">
⏭ Next
</button>

<button class="shuffle" id="shuffleBtn">
🔀 Random
</button>

<button class="zoomIn" id="zoomInBtn">
➕ Zoom
</button>

<button class="zoomOut" id="zoomOutBtn">
➖ Zoom
</button>

<button class="reset" id="resetBtn">
🔄 Reset
</button>

</div>

</div>

<div
id="grid"
class="grid">
</div>

<script>
