<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PPPP Chat Admin | People's Power & Peace Party Bangladesh</title>

<link rel="icon" href="../favicon.ico">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="admin.css">

</head>

<body>

<div class="admin-layout">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            PPPP CHAT

        </div>

        <div class="sidebar-header">

            Conversations

        </div>

        <div
            id="conversation-list"
            class="conversation-list"
        >

            Loading...

        </div>

    </aside>

    <!-- Chat Area -->

    <main class="chat-area">

        <div class="chat-header">

            <div>

                <h2 id="visitor-name">

                    Select Conversation

                </h2>

                <small id="visitor-status">

                    🔴 Offline

                </small>

            </div>

            <button id="logoutBtn">

                Logout

            </button>

        </div>

        <div
            id="admin-messages"
            class="admin-messages"
        >

            <div class="empty-chat">

                Select a conversation to start chatting.

            </div>

        </div>

        <div
            id="typing-indicator"
            class="typing-indicator"
        ></div>

        <div class="chat-footer">

            <input

                id="reply-text"

                type="text"

                placeholder="Type your reply..."

                autocomplete="off"

                disabled

            >

            <button

                id="sendReply"

                disabled

            >

                Send

            </button>

        </div>

    </main>

</div>

<script type="module" src="admin.js"></script>

</body>

</html>
