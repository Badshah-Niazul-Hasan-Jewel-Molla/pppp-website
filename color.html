<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>125 Color Box System</title>

<style>
body{
  margin:0;
  background:#0f0f0f;
  font-family:Arial, sans-serif;
  color:#ddd;
}

h1{
  text-align:center;
  padding:20px;
  color:#fff;
}

.container{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:6px;
  padding:20px;
}

.box{
  width:110px;
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  cursor:pointer;
  color:#fff;
  border-radius:6px;
  box-shadow:0 0 6px rgba(0,0,0,0.4);
  transition:0.2s;
}

.box:hover{
  transform:scale(1.05);
}
</style>
</head>

<body>

<h1>125 Tone Color Grid</h1>
<div class="container" id="grid"></div>

<script>
const colors = [
"#191919","#191938","#191957","#191976","#191995",
"#193819","#193838","#193857","#193876","#193895",
"#195719","#195738","#195757","#195776","#195795",
"#197619","#197638","#197657","#197676","#197695",
"#199519","#199538","#199557","#199576","#199595",

"#381919","#381938","#381957","#381976","#381995",
"#383819","#383838","#383857","#383876","#383895",
"#385719","#385738","#385757","#385776","#385795",
"#387619","#387638","#387657","#387676","#387695",
"#389519","#389538","#389557","#389576","#389595",

"#571919","#571938","#571957","#571976","#571995",
"#573819","#573838","#573857","#573876","#573895",
"#575719","#575738","#575757","#575776","#575795",
"#577619","#577638","#577657","#577676","#577695",
"#579519","#579538","#579557","#579576","#579595",

"#761919","#761938","#761957","#761976","#761995",
"#763819","#763838","#763857","#763876","#763895",
"#765719","#765738","#765757","#765776","#765795",
"#767619","#767638","#767657","#767676","#767695",
"#769519","#769538","#769557","#769576","#769595",

"#951919","#951938","#951957","#951976","#951995",
"#953819","#953838","#953857","#953876","#953895",
"#955719","#955738","#955757","#955776","#955795",
"#957619","#957638","#957657","#957676","#957695",
"#959519","#959538","#959557","#959576","#959595"
];

function copyHex(hex){
  navigator.clipboard.writeText(hex);
}

const grid = document.getElementById("grid");

colors.forEach(c=>{
  const div = document.createElement("div");
  div.className = "box";
  div.style.background = c;
  div.innerText = c;
  div.onclick = () => copyHex(c);
  grid.appendChild(div);
});
</script>

</body>
</html>
